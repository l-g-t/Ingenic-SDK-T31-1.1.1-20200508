name: build-uboot-sdcard-cgrrty-sdk

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex bc libssl-dev \
            device-tree-compiler u-boot-tools git \
            libncurses-dev python3 p7zip-full lzop

      - name: Clone Ingenic T31 SDK (cgrrty)
        run: |
          git clone --depth 1 https://github.com/cgrrty/Ingenic-SDK-T31-1.1.1-20200508.git sdk

      - name: Extract MIPS toolchain from SDK
        run: |
          find sdk/toolchain -iname "*.7z"
          7z x sdk/toolchain/gcc_472/mips-gcc472-glibc216-64bit-r2.3.3.7z -o/opt/toolchain
          find /opt/toolchain -maxdepth 3 -iname "*gcc" | head -5
          echo "/opt/toolchain/mips-gcc472-glibc216-64bit-r2.3.3/bin" >> "$GITHUB_PATH"

      - name: Build U-Boot for SD card boot (T31X)
        working-directory: sdk/opensource/uboot
        run: |
          make distclean
          make isvp_t31_msc0_ddr128M
          echo "=== 编译产物列表 ==="
          ls -lh *.bin

      - name: Upload all bin artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: uboot-cgrrty-sdk-output
          path: sdk/opensource/uboot/*.bin
