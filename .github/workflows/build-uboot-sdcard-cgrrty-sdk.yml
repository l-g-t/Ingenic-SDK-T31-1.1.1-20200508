name: build-uboot-sdcard-cgrrty-sdk

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex bc libssl-dev \
            device-tree-compiler u-boot-tools git \
            libncurses-dev python3 p7zip-full unrar libarchive-tools

      - name: Clone Ingenic T31 SDK (cgrrty)
        run: |
          git clone --depth 1 https://github.com/cgrrty/Ingenic-SDK-T31-1.1.1-20200508.git sdk

      - name: Extract MIPS toolchain from SDK
        run: |
          echo "=== 1. 解压 RAR 分卷 ==="
          mkdir -p /opt/toolchain
          unrar x sdk/toolchain/toolchain.part1.rar /opt/toolchain/
          
          echo "=== 2. 查看 RAR 解压出的内容 ==="
          find /opt/toolchain -maxdepth 2 -type f
          
          echo "=== 3. 用 bsdtar 解压 64bit gcc-4.7.2 工具链 ==="
          # 7z 会拒绝包含 .. 的符号链接，改用 bsdtar 完美支持
          bsdtar -xf /opt/toolchain/gcc_472/mips-gcc472-glibc216-64bit-r2.3.3.7z -C /opt/toolchain
          
          echo "=== 4. 确认解压后的目录结构 ==="
          find /opt/toolchain -maxdepth 3 -type d | head -20
          
          echo "=== 5. 查找 mips gcc ==="
          find /opt/toolchain -maxdepth 4 -name "mips*-gcc" | head -10
          
          echo "=== 6. 定位 bin 目录并加入 PATH ==="
          TC_BIN=$(find /opt/toolchain -maxdepth 3 -type d -name "bin" | head -1)
          if [ -z "$TC_BIN" ]; then
            echo "错误：未找到 toolchain/bin 目录"
            exit 1
          fi
          echo "Toolchain bin: $TC_BIN"
          echo "$TC_BIN" >> "$GITHUB_PATH"
          
          echo "=== 7. 验证交叉编译器 ==="
          export PATH="$TC_BIN:$PATH"
          mips-linux-gnu-gcc --version || true


      - name: Locate flash ID table in source  Dump flash ID table context
        run: |
          echo "=== 搜索包含 GM25Q128A 字样的文件 ==="
          grep -rn "GM25Q128A" sdk/opensource/uboot/ || true
          echo ""
          echo "=== 搜索包含 jz_spi_support_table 字样的文件 ==="
          grep -rln "jz_spi_support_table" sdk/opensource/uboot/ || true

          echo "=== GM25Q128A 条目上下文（第700-760行）==="
          sed -n '700,760p' sdk/opensource/uboot/drivers/spi/jz_spi.h
          echo ""
          echo "=== 搜索匹配逻辑相关代码 ==="
          grep -n "jz_spi_support_table\[i\]\|id_manufactory ==" sdk/opensource/uboot/drivers/spi/jz_spi.c


      - name: Build U-Boot for SD card boot (T31X)
        working-directory: sdk/opensource/uboot
        run: |
          export PATH="$(cat $GITHUB_PATH | tr '\n' ':')$PATH"
          export CROSS_COMPILE=mips-linux-gnu-
          make distclean
          make isvp_t31_msc0_ddr128M
          echo "=== 编译产物列表 ==="
          ls -lh *.bin

      - name: Upload all bin artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: uboot-cgrrty-sdk-output
          path: sdk/opensource/uboot/*.bin
