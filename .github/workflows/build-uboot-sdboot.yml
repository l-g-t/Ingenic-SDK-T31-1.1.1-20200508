name: build-uboot-sdcard-recovery

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex bc libssl-dev \
            device-tree-compiler u-boot-tools git \
            libncurses-dev python3 lib32z1 lzop

      - name: Clone MIPS toolchain
        run: |
          git clone --depth 1 https://github.com/Dafang-Hacks/mips-gcc472-glibc216-64bit.git /opt/toolchain
          echo "/opt/toolchain/bin" >> "$GITHUB_PATH"

      - name: Clone OpenIPC u-boot-ingenic
        run: |
          git clone --depth 1 https://github.com/OpenIPC/u-boot-ingenic.git

      - name: Build U-Boot for SD card boot (T31X)
        working-directory: u-boot-ingenic
        env:
          CROSS_COMPILE: mips-linux-gnu-
        run: |
          make distclean
          make isvp_t31_msc0_ddr128M
          make -j$(nproc)

          # 列出所有生成的 bin 文件，方便调试
          ls -lh *.bin

          # 检查实际生成的产物
          if [ -f u-boot-lzo-with-spl-mbr-gpt.bin ]; then
            echo "Found u-boot-lzo-with-spl-mbr-gpt.bin"
          elif [ -f u-boot-lzo-with-spl.bin ]; then
            echo "Found u-boot-lzo-with-spl.bin"
          else
            echo "Error: No expected output binary found!"
            exit 1
          fi

      - name: Upload u-boot binaries
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-t31x-sdboot
          # 上传两个产物（如果都存在）
          path: |
            u-boot-ingenic/u-boot-lzo-with-spl-mbr-gpt.bin
            u-boot-ingenic/u-boot-lzo-with-spl.bin
